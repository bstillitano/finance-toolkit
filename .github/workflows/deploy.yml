name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject config
        # Writes config.js from GitHub secrets at deploy time.
        # This file is gitignored and never committed to the repo.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          python3 - << 'PYEOF'
          import os

          def e(key, default=''):
              return os.environ.get(key, default)

          with open('config.js', 'w') as f:
              f.write('// Auto-generated by GitHub Actions — do not commit\n')
              f.write('window.APP_CONFIG = {\n')
              f.write(f'  supabaseUrl:            "{e("SUPABASE_URL")}",\n')
              f.write(f'  supabaseKey:            "{e("SUPABASE_ANON_KEY")}",\n')
              f.write(f'  firebaseApiKey:         "{e("FIREBASE_API_KEY")}",\n')
              f.write(f'  firebaseAuthDomain:     "{e("FIREBASE_AUTH_DOMAIN")}",\n')
              f.write(f'  firebaseProjectId:      "{e("FIREBASE_PROJECT_ID")}",\n')
              f.write(f'  firebaseStorageBucket:  "{e("FIREBASE_STORAGE_BUCKET")}",\n')
              f.write(f'  firebaseSenderId:       "{e("FIREBASE_MESSAGING_SENDER_ID")}",\n')
              f.write(f'  firebaseAppId:          "{e("FIREBASE_APP_ID")}",\n')
              f.write(f'  firebaseMeasurementId:  "{e("FIREBASE_MEASUREMENT_ID")}",\n')
              f.write('};\n')

          print('config.js written (contents not logged)')
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
