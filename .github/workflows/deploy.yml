name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase config
        # Writes config.js from GitHub secrets at deploy time.
        # This file is gitignored and never committed to the repo.
        # If secrets are not set, writes a no-op config so the app
        # falls back to localStorage gracefully.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          python3 - << 'PYEOF'
          import os

          url = os.environ.get('SUPABASE_URL', '')
          key = os.environ.get('SUPABASE_ANON_KEY', '')
          ga  = os.environ.get('GA_MEASUREMENT_ID', '')

          # Write config.js — never logged, never committed
          with open('config.js', 'w') as f:
              f.write('// Auto-generated by GitHub Actions — do not commit\n')
              f.write('window.APP_CONFIG = {\n')
              f.write(f'  supabaseUrl:     "{url}",\n')
              f.write(f'  supabaseKey:     "{key}",\n')
              f.write(f'  gaMeasurementId: "{ga}",\n')
              f.write('};\n')

          print('config.js written (contents not logged)')
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
